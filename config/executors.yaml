executors:
  - id: executor_vendor_api_domestic_default
    name: "Vendor API Ops · Domestic Node"
    type: vendor_api
    base_url: "${VENDOR_API_BASE_URL:-http://117.50.80.158:8310}"
    status: active
    weight: 10
    max_concurrency: 8
    config:
      provider: "vendor_api"
      providers: ["baidu", "volcengine", "kie"]
      baseUrl: "${VENDOR_API_BASE_URL:-http://117.50.80.158:8310}"
      tags: ["vendor-api", "domestic-egress"]
      fallbackToLegacy: false
  - id: executor_vendor_api_global_default
    name: "Vendor API Ops · Global Egress Node"
    type: vendor_api
    base_url: "${VENDOR_API_BASE_URL:-http://117.50.80.158:8310}"
    status: active
    weight: 9
    max_concurrency: 4
    config:
      provider: "vendor_api"
      providers: ["openai", "openai_compatible"]
      baseUrl: "${VENDOR_API_BASE_URL:-http://117.50.80.158:8310}"
      tags: ["vendor-api", "global-egress"]
      fallbackToLegacy: false
  - id: executor_baidu_image_default
    name: "百度图像处理 · Default Node"
    type: baidu
    base_url: "https://aip.baidubce.com"
    status: active
    weight: 1
    max_concurrency: 2
    config:
      apiKey: "${BAIDU_API_KEY}"
      secretKey: "${BAIDU_SECRET_KEY}"
  - id: executor_volcengine_default
    name: "火山 Doubao · Default Node"
    type: volcengine
    base_url: "https://ark.cn-beijing.volces.com"
    status: active
    weight: 1
    max_concurrency: 2
    config:
      apiKey: "${VOLCENGINE_API_KEY}"
      baseUrl: "https://ark.cn-beijing.volces.com"
  - id: executor_kie_market_default
    name: "KIE Market · Default Node"
    type: kie
    base_url: "https://api.kie.ai"
    status: active
    weight: 1
    # KIE official limit is higher; platform side keeps a safer cap while avoiding
    # the previous too-low bottleneck.
    max_concurrency: 10
    config:
      apiKey: "${KIE_API_KEY}"
      baseUrl: "https://api.kie.ai"
  - id: executor_vidu_default
    name: "Vidu Video · Default Node"
    type: vidu
    base_url: "https://api.vidu.cn"
    status: active
    weight: 1
    max_concurrency: 4
    config:
      apiKey: "${VIDU_API_KEY}"
      baseUrl: "https://api.vidu.cn"
      tags: ["vidu", "video-generation", "domestic-egress"]
  - id: executor_comfyui_seamless_117
    name: "ComfyUI 4090 · 233 · 117.50.216.233"
    type: comfyui
    base_url: "http://117.50.216.233:8079"
    status: active
    weight: 1
    max_concurrency: 10
    config:
      baseUrl: "http://117.50.216.233:8079"
      provider: "comfyui"
      tags:
        - "comfyui-general"
        - "gpu:4090"
        - "host:233"
        - "comfyui-233"
  - id: executor_comfyui_pattern_extract_158
    name: "ComfyUI 5090 · 158 · 117.50.80.158"
    type: comfyui
    base_url: "http://117.50.80.158:8079"
    status: active
    weight: 1
    max_concurrency: 10
    config:
      baseUrl: "http://117.50.80.158:8079"
      provider: "comfyui"
      tags:
        - "comfyui-general"
        - "gpu:5090"
        - "host:158"
        - "comfyui-158"
