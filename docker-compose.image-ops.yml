services:
  image-ops:
    build:
      context: .
      dockerfile: image-ops-service/Dockerfile
    container_name: podi-image-ops
    ports:
      - "${IMAGE_OPS_PUBLISH_HOST:-127.0.0.1}:${IMAGE_OPS_PORT:-8301}:8301"
    env_file:
      - ./image-ops-service/.env
    environment:
      TZ: "Asia/Shanghai"
    restart: unless-stopped
